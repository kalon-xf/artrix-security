services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      ARTRIX_DEMO_MODE: "false"
      DATABASE_URL: postgresql://artrix:artrix@postgres:5432/artrix
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: artrix
      POSTGRES_USER: artrix
      POSTGRES_PASSWORD: artrix
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artrix -d artrix"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
